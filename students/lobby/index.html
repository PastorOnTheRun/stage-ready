<script>
(function () {
  "use strict";
  var DUR = 13000;                       // per slide (ms)

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function todayET() {
    try {
      var p = {};

        .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
      if (p.year && p.month && p.day) return p.year + "-" + p.month + "-" + p.day;
    } catch (e) { /* old browser without formatToParts: US Eastern rule below */ }
    // EDT (UTC-4) from 2nd Sunday of March 2:00 to 1st Sunday of November 2:00 local; EST (UTC-5) otherwise.
    var now = Date.now(), y = new Date(now).getUTCFullYear();
    function nthSunday(month, n) { var d1 = new Date(Date.UTC(y, month, 1)); return 1 + (7 - d1.getUTCDay()) % 7 + (n - 1) * 7; }
    var dstStart = Date.UTC(y, 2, nthSunday(2, 2), 7), dstEnd = Date.UTC(y, 10, nthSunday(10, 1), 6);
    var d = new Date(now - ((now >= dstStart && now < dstEnd) ? 4 : 5) * 3600 * 1000);
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  // Recurring items always show; dated items hide the day after their date (multi-day: after endDate); undated items show.
  function visibleItem(it, today) {
    if (it.recurring) return true;
    var end = it.endDate || it.date;
    return !end || end >= today;
  }
  function visibleSections(d, today) {
    var out = [];
    (d.sections || []).forEach(function (s) {
      var items = (s.items || []).filter(function (it) { return s.kind === "reminders" ? !!(it && it.text) : !!(it && it.title) && visibleItem(it, today); });
      if (items.length) out.push({ id: s.id, title: s.title, kind: s.kind, items: items });
    });
    return out;
  }
  function cardHTML(it) {
    var when = String(it.when || "").split(" · ").map(function (w) { return "<span>" + esc(w) + "</span>"; }).join("");
    var h = '<div class="card"><p class="when">' + when + '</p><div class="body"><h3>' + esc(it.title) + "</h3>";
    (it.details || []).forEach(function (x) { h += '<p class="detail">' + esc(x) + "</p>"; });
    if (it.status) h += '<p class="status">' + esc(it.status) + "</p>";

  function newSlide(sec, dark) {
    var el = document.createElement("section");
    el.className = "slide measure";
    el.setAttribute("data-section", sec.id);
    el.innerHTML = '<div class="sec' + (dark ? " dark" : "") + '"><h2>' + esc(sec.title) + '</h2><span class="page"></span></div>' +
      (sec.kind === "reminders" ? '<div class="list"><ol class="reminders"></ol></div>' : '<div class="list"></div>');
    slidesEl.appendChild(el);

  }
  function overflows(list) { return list.scrollHeight > list.clientHeight + 1; }

  // Build slides by measuring: add items one at a time; start a new slide when the list would overflow (max 3 per slide).
  function build() {
    var today = todayET();
    var secs = visibleSections(data, today);
    slidesEl.innerHTML = "";
    slides = [];
    secs.forEach(function (sec) {
      var reminders = sec.kind === "reminders";
      var group = [];
      var el = newSlide(sec, reminders), list = el.querySelector(reminders ? ".reminders" : ".list"), count = 0;
      group.push(el);
      sec.items.forEach(function (it, i) {
        var node;
        if (reminders) {
          node = document.createElement("li");
          node.innerHTML = '<span class="n">' + pad(i + 1) + "</span><span>" + esc(it.text) + "</span>";
        } else {
          var tmp = document.createElement("div"); tmp.innerHTML = cardHTML(it); node = tmp.firstChild;
        }
        if (count >= (reminders ? 6 : MAX_PER_SLIDE)) { el = newSlide(sec, reminders); list = el.querySelector(reminders ? ".reminders" : ".list"); count = 0; group.push(el); }
        list.appendChild(node); count++;
        if (count > 1 && overflows(el.querySelector(".list"))) {
          list.removeChild(node);
          el = newSlide(sec, reminders); list = el.querySelector(reminders ? ".reminders" : ".list"); group.push(el);
          list.appendChild(node); count = 1;
        }

      if (group.length > 1) group.forEach(function (g, k) { g.querySelector(".page").textContent = (k + 1) + " / " + group.length; });

    lastKey = today + "|" + JSON.stringify(secs);
    progressEl.innerHTML = slides.map(function () { return '<span class="seg"><i></i></span>'; }).join("") +
      '<span class="count"></span>';
    window.__lobby = { today: today, slides: slides.map(function (s) { return s.getAttribute("data-section") + (s.querySelector(".page").textContent ? " " + s.querySelector(".page").textContent : ""); }) };
  }

      var today = todayET();

      next = 0;

    clearTimeout(timer);

    show(0);
    timer = setTimeout(tick, DUR);
  }
  function applyText(d) {
    if (d.org) document.getElementById("org").textContent = d.org;
    if (d.campus) document.getElementById("campus").textContent = d.campus;
    if (d.vision) document.getElementById("vision").innerHTML = String(d.vision).split(/\s+/).map(function (w) { return "<span>" + esc(w) + "</span>"; }).join("");
  }

  function sizeRoot() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;

  applyText(data);
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  fontsReady.then(start, start);

  // Prefer the live data file (same one /students/ is built from); keep the embedded copy if it fails.
  if (window.fetch) {
    fetch("../announcements.json?cb=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.sections || JSON.stringify(d) === JSON.stringify(data)) return;

      .catch(function () { /* offline or blocked: embedded copy keeps running */ });
  }

  var rs = null;
  window.addEventListener("resize", function () { clearTimeout(rs); rs = setTimeout(function () { sizeRoot(); start(); }, 400); });
  // Reload about every 30 minutes, only when online (quick check fetch first).
  setInterval(function () {
    if (navigator.onLine === false || !window.fetch) return;
    fetch("../announcements.json?ping=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (r.ok) location.reload(); })
      .catch(function () { /* stay on the current slides */ });
  }, RELOAD_EVERY);
})();
